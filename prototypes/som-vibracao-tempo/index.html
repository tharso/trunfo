<!doctype html>
<!--
  PROTÓTIPO DESCARTÁVEL — ticket "Som, vibração e tempo das animações" (tharso/trunfo#14).
  Pergunta: como a jogada deve "soar e sentir" no celular? Tem som? Vibra? Quanto dura
  a animação do duelo e dá para pular?
  Base: rodada "Duelo" já decidida no ticket "Telas e fluxo da partida solo" (#9).
  Três "sensações", trocadas por ?variant=A|B|C (ou setas ← →):
    A — Discreto: som começa DESLIGADO, só no resultado; vibra só quando você ganha;
        barras em 0,6 s, juntas.
    B — Arcade: som LIGADO em tudo (toque, largada, barras, resultado, fim);
        vibra em tudo; barras em 1,1 s com o número contando.
    C — Suspense: som LIGADO; tique-taque enquanto as barras crescem; a sua barra
        corre primeiro e depois a do computador (~3 s no total); botão "Pular".
  Em todas: tocar na tela do duelo pula a animação. Sons gerados na hora (Web Audio),
  sem arquivos. Vibração usa navigator.vibrate (funciona no Android; o iPhone não vibra
  pela web, então o protótipo mostra 📳 na tela no lugar). Nada é salvo.
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Protótipo — Som, vibração e tempo</title>
<style>
  :root { --bg:#dfe4ea; --ink:#14181f; --mute:#5d6672; --line:#d5dae0; --paper:#f8f9fb; --gold:#e8b400; --win:#1b8a3a; --lose:#c62828; --tie:#8a6d00; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.3 system-ui,-apple-system,"Segoe UI",sans-serif; }
  button { font:inherit; color:inherit; cursor:pointer; }
  .frame { container-type:inline-size; margin:0 auto; min-height:100dvh; background:var(--paper); position:relative; overflow:hidden; }
  .frame.cel { max-width:390px; }
  .scr { padding:12px 14px 200px; }
  .btn { display:block; width:100%; padding:16px; border:0; border-radius:14px; font-size:18px; font-weight:800; background:var(--ink); color:#fff; }
  .btn.sec { background:#fff; color:var(--ink); border:2px solid var(--line); }
  .muted { color:var(--mute); font-size:13px; }
  .chip { display:inline-flex; gap:6px; align-items:center; border-radius:999px; padding:4px 10px; font-size:13px; font-weight:700; background:#fff; border:1px solid var(--line); }
  .menu { border:0; background:none; font-size:22px; padding:4px 8px; }
  @keyframes pop { from { transform:scale(.85); opacity:0 } to { transform:none; opacity:1 } }
  @keyframes slideup { from { transform:translateY(40px); opacity:0 } to { transform:none; opacity:1 } }
  @keyframes flip { 0% { transform:rotateY(90deg) } 100% { transform:none } }
  .pop { animation:pop .25s ease-out both; } .slideup { animation:slideup .3s ease-out both; } .flip { animation:flip .35s ease-out both; }

  /* ---- Carta (decidida no ticket #8) ---- */
  .card { border-radius:22px; overflow:hidden; background:#fff; box-shadow:0 6px 20px #0002; border:3px solid var(--c1); }
  .c-head { position:relative; height:130px; background:linear-gradient(135deg,var(--c1) 0 55%,var(--c2) 55% 70%,var(--c1) 70%); }
  .c-head .avatar { position:absolute; left:50%; top:14px; transform:translateX(-50%); width:96px; height:96px; border-radius:50%; background:#0003; border:3px solid #fff8; font-size:34px; }
  .c-head .flag { position:absolute; right:12px; top:8px; font-size:30px; }
  .c-head .badge { position:absolute; left:12px; top:12px; font-size:15px; }
  .avatar { display:flex; align-items:center; justify-content:center; font-weight:900; color:#fff; letter-spacing:1px; text-shadow:0 1px 2px #0006; }
  .badge { display:inline-flex; font-weight:900; border-radius:8px; padding:2px 8px; font-size:13px; background:#fff; color:#000; }
  .badge.st { background:var(--gold); } .badge.a { background:var(--lose); color:#fff; }
  .c-name { padding:8px 14px 0; font-size:21px; font-weight:900; }
  .c-sub { padding:0 14px 8px; font-size:13px; color:var(--mute); }
  .c-row { display:grid; grid-template-columns:1fr 46px; align-items:center; gap:10px; width:100%; min-height:48px; padding:5px 14px; border:0; border-top:1px solid var(--line); background:none; text-align:left; }
  .c-row .lbl { font-weight:700; } .c-row .lbl small { font-weight:400; opacity:.85; }
  .c-row .bar { height:8px; border-radius:3px; background:var(--line); margin-top:4px; }
  .c-row .bar i { display:block; height:100%; border-radius:4px; }
  .c-row .num { font-size:23px; font-weight:900; text-align:right; }
  .c-row.sel { background:var(--c1); color:#fff; } .c-row.sel .bar { background:#fff4; }
  .c-row.hi { box-shadow:inset 0 0 0 3px var(--ink); background:#fff7d6; }
  .c-row.hi.w { background:#dff3e3; box-shadow:inset 0 0 0 3px var(--win); }
  .c-row.hi.l { background:#fbe1e1; box-shadow:inset 0 0 0 3px var(--lose); }
  .c-row.dim { opacity:.35; }
  .card.back { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; background:repeating-linear-gradient(45deg,#24303f 0 12px,#2c3a4c 12px 24px); border-color:#24303f; color:#fff; }
  .card.back b { font-size:44px; }

  /* ---- Início / sorteio / fim ---- */
  .home { max-width:560px; margin:0 auto; display:flex; flex-direction:column; gap:16px; padding:28px 20px 200px; min-height:100dvh; }
  .home h1 { font-size:34px; line-height:1; margin:10px 0 0; font-weight:900; }
  .fan { position:relative; height:170px; margin:8px auto 0; width:220px; }
  .fan .card { position:absolute; width:110px; height:160px; left:55px; top:0; }
  .seg { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .seg button { padding:14px 10px; border-radius:14px; border:2px solid var(--line); background:#fff; text-align:left; }
  .seg button b { display:block; font-size:17px; } .seg button span { font-size:12px; color:var(--mute); }
  .seg button.on { border-color:var(--ink); box-shadow:inset 0 0 0 1px var(--ink); }
  details { background:#fff; border-radius:14px; padding:12px 14px; border:1px solid var(--line); font-size:14px; }
  details summary { font-weight:700; }
  .center { text-align:center; }
  .big { font-size:30px; font-weight:900; margin:6px 0; }
  .coin { width:120px; height:120px; border-radius:50%; margin:30px auto 10px; display:flex; align-items:center; justify-content:center; font-size:46px; background:var(--gold); box-shadow:0 6px 20px #0003; }
  .score-big { display:flex; justify-content:center; gap:18px; align-items:baseline; font-weight:900; font-size:48px; margin:6px 0 4px; }
  .score-big small { font-size:13px; font-weight:600; color:var(--mute); display:block; text-align:center; }
  .stats { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:14px 0; }
  .stats div { background:#fff; border:1px solid var(--line); border-radius:12px; padding:10px; } .stats b { display:block; font-size:20px; }
  .sheet { position:absolute; inset:0; background:#0007; display:flex; align-items:flex-end; z-index:5; }
  .sheet > div { background:#fff; width:100%; border-radius:20px 20px 0 0; padding:18px; display:grid; gap:10px; }

  /* ---- comum à rodada ---- */
  .topbar { display:flex; align-items:center; justify-content:space-between; gap:6px; margin-bottom:10px; font-size:13px; color:var(--mute); }
  .stage { text-align:center; font-weight:800; font-size:18px; min-height:46px; margin-top:10px; }
  .stage small { display:block; font-weight:400; font-size:13px; color:var(--mute); }
  .why { font-size:13px; color:var(--mute); }
  .res-w { color:var(--win); } .res-l { color:var(--lose); } .res-t { color:var(--tie); }

  /* ---- A: uma carta por vez ---- */
  .A-strip { max-width:900px; margin-left:auto; margin-right:auto; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; background:#fff; border:1px solid var(--line); border-radius:14px; padding:8px 12px; margin-bottom:10px; }
  .A-strip .me { font-weight:900; font-size:20px; } .A-strip .cpu { font-weight:900; font-size:20px; text-align:right; }
  .A-strip small { display:block; font-size:11px; color:var(--mute); font-weight:600; }
  .A-who { font-size:13px; font-weight:800; margin:0 0 6px 4px; color:var(--mute); }
  .A-wrap.rev { display:flex; flex-direction:column; gap:12px; } .A-wrap.rev .A-result { order:-1; }
  .A-result { padding:12px 14px; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 6px 20px #0001; }
  .A-vs { display:grid; grid-template-columns:1fr auto 1fr; gap:8px; align-items:center; margin:8px 0 12px; }
  .A-vs .s { background:var(--paper); border-radius:12px; padding:8px 10px; } .A-vs .s b { font-size:28px; display:block; }
  .A-vs .s.w { background:#dff3e3; } .A-vs .s.l { background:#fbe1e1; opacity:.8; }
  .A-tabs { display:flex; gap:6px; margin-bottom:8px; } .A-tabs button { flex:1; padding:8px; border-radius:10px; border:1px solid var(--line); background:#fff; font-weight:700; font-size:14px; } .A-tabs button.on { background:var(--ink); color:#fff; }
  @container (min-width:800px) {
    .A-wrap { display:grid; grid-template-columns:420px 1fr; gap:28px; max-width:900px; margin:0 auto; align-items:start; }
    .A-wrap.rev { display:grid; } .A-wrap.rev .A-result { order:2; padding:18px; }
    .A-tabs { display:none; } .A-both .card { margin-bottom:12px; }
  }

  /* ---- B: mesa ---- */
  .B-table { display:grid; gap:10px; }
  .B-cpu { display:flex; gap:10px; align-items:center; background:#fff; border:1px solid var(--line); border-radius:16px; padding:8px; }
  .B-cpu .mini { flex:none; width:64px; height:88px; border-radius:10px; }
  .B-cpu .mini.card { border-width:2px; display:flex; flex-direction:column; align-items:center; justify-content:center; background:var(--c1); color:#fff; font-weight:900; }
  .B-cpu .mini.back b { font-size:26px; }
  .B-cpu .info { flex:1; min-width:0; } .B-cpu .info b { font-size:16px; }
  .B-cpu .val { font-size:34px; font-weight:900; min-width:54px; text-align:right; padding-right:6px; }
  .B-pile { font-size:12px; color:var(--mute); }
  .B-mid { display:flex; justify-content:center; gap:8px; align-items:center; min-height:30px; }
  .B-me-lbl { display:flex; justify-content:space-between; font-size:13px; font-weight:800; color:var(--mute); margin:0 4px 4px; }
  .ribbon { display:inline-block; padding:2px 10px; border-radius:999px; font-size:12px; font-weight:900; color:#fff; background:var(--win); }
  .ribbon.l { background:var(--lose); } .ribbon.t { background:var(--tie); }
  .B-next { margin-top:12px; }
  .B-desk { display:none; }
  @container (min-width:800px) {
    .B-mobile { display:none; }
    .B-desk { display:grid; grid-template-columns:380px 120px 380px; justify-content:center; gap:10px; align-items:start; }
    .B-desk .vs { align-self:center; text-align:center; font-weight:900; font-size:28px; }
    .B-desk .vs .B-pile { font-weight:600; }
    .B-desk .card.back { height:640px; }
  }

  /* ---- C: duelo ---- */
  .C-tug { display:flex; height:14px; border-radius:7px; overflow:hidden; background:var(--line); margin:4px 0 2px; }
  .C-tug i { display:block; height:100%; transition:width var(--tug,.5s); }
  .C-tugl { display:flex; justify-content:space-between; font-size:12px; font-weight:800; }
  .C-duel { position:absolute; inset:0; z-index:4; background:#101820; color:#fff; padding:22px 18px 200px; display:flex; flex-direction:column; gap:18px; }
  .C-duel h2 { margin:0; font-size:28px; text-align:center; } .C-duel .sub { text-align:center; color:#fffa; font-size:14px; }
  .lane { background:#ffffff10; border-radius:16px; padding:12px; }
  .lane .who { display:flex; align-items:center; gap:10px; font-weight:800; }
  .lane .who .avatar { width:40px; height:40px; border-radius:50%; background:var(--c1); box-shadow:0 0 0 3px var(--c2); font-size:14px; }
  .lane .who .n { margin-left:auto; font-size:34px; font-weight:900; }
  .lane .track { height:18px; border-radius:9px; background:#ffffff18; margin-top:10px; overflow:hidden; }
  .lane .track i { display:block; height:100%; width:0; border-radius:9px; background:var(--c2); transition:width 1.1s cubic-bezier(.2,.8,.2,1); }
  .lane.w { box-shadow:inset 0 0 0 3px #3ddc84; } .lane.l { opacity:.6; }
  .C-verdict { text-align:center; font-size:26px; font-weight:900; } .C-verdict small { display:block; font-size:14px; font-weight:400; color:#fffb; margin-top:4px; }
  .C-duel .btn { background:#fff; color:#101820; } .C-duel .btn.sec { background:transparent; color:#fff; border-color:#fff5; }
  .C-peek { display:grid; grid-template-columns:1fr 1fr; gap:10px; } .C-peek .card { transform:scale(1); }
  @container (min-width:800px) {
    .C-wrap { max-width:430px; margin:0 auto; }
    .C-duel { padding:40px max(40px, calc(50% - 360px)) 200px; }
  }

  /* ---- Som, vibração e tempo ---- */
  .C-duel .C-verdict, .C-duel .acts { opacity:0; transform:translateY(16px); transition:opacity .25s, transform .25s; pointer-events:none; }
  .C-duel.done .C-verdict, .C-duel.done .acts { opacity:1; transform:none; pointer-events:auto; }
  .C-duel .skip { position:absolute; right:14px; top:14px; border:1px solid #fff5; background:transparent; color:#fff; border-radius:999px; padding:6px 12px; font-size:14px; }
  .C-duel.done .skip { display:none; }
  .C-duel .hint { text-align:center; font-size:12px; color:#fff7; } .C-duel.done .hint { display:none; }
  .lane.w { transform:scale(1.02); transition:transform .2s; }
  .sombtn { border:0; background:none; font-size:20px; padding:4px 8px; }
  .buzz { position:fixed; left:50%; top:30%; transform:translateX(-50%); z-index:30; font-size:54px; pointer-events:none; animation:buzz .35s linear both; }
  @keyframes buzz { 0%,100% { transform:translateX(-50%) } 20% { transform:translateX(-56%) rotate(-8deg) } 40% { transform:translateX(-44%) rotate(8deg) } 60% { transform:translateX(-54%) } 80% { transform:translateX(-46%) } }
  .proto .log { background:#111; color:#9fe; border-radius:10px; padding:4px 10px; font:11px ui-monospace,monospace; max-width:92vw; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* ---- Barra do protótipo (não faz parte do design) ---- */
  .proto { position:fixed; left:50%; bottom:10px; transform:translateX(-50%); z-index:20; display:flex; flex-direction:column; gap:5px; align-items:center; font:12px system-ui; }
  .proto .pill { display:flex; flex-wrap:wrap; justify-content:center; gap:4px; align-items:center; background:#111; color:#fff; border-radius:999px; padding:4px; box-shadow:0 4px 16px #0005; }
  .proto button { white-space:nowrap; border:0; background:#333; color:#fff; border-radius:999px; padding:6px 10px; }
  .proto button.on { background:#fff; color:#111; }
  .proto .lbl { padding:0 8px; white-space:nowrap; font-weight:700; }
  .state { position:fixed; right:8px; top:8px; z-index:19; max-width:240px; font:10px/1.35 ui-monospace,monospace; background:#111d; color:#cfe; padding:6px 8px; border-radius:8px; white-space:pre-wrap; pointer-events:none; }
  @media (max-width:700px) { .state { display:none; } }
</style>
</head>

<div class="proto" id="proto"></div>

  if (st.fase==='escolher') return st.sel==null ? `<small>Sua vez: toque num atributo da sua carta</small>`
    : `${ATR[st.sel].ico} ${ATR[st.sel].etapa}<small>${ATR[st.sel].nome} ${eu.n[st.sel]} — toque de novo para correr</small>`;
  if (st.fase==='cpuEscolheu') return `${ATR[st.atr].ico} ${ATR[st.atr].etapa}<small>O computador escolheu ${ATR[st.atr].nome}. Sua nota: ${eu.n[st.atr]}</small>`;
  return `${ATR[st.atr].ico} ${ATR[st.atr].etapa}`;
}
function resTxt(){ return st.res===1 ? '<span class="res-w">Você ganhou a rodada!</span>' : st.res===-1 ? '<span class="res-l">O computador ganhou.</span>' : '<span class="res-t">Empate!</span>'; }
function levaTxt(){
  const n = 2 + st.empate.length;
  return st.res===0 ? `As 2 cartas vão para o monte de empate (${st.empate.length+2} no meio). ${st.escolhe==='eu'?'Você':'O computador'} escolhe de novo.`
    : `${st.res===1?'Você leva':'O computador leva'} ${n} cartas${st.empate.length?` (com o monte de empate)`:''}.`;
}
const proxBtn = () => `<button class="btn" onclick="momento('monte');proxima();render();if(st.tela==='fim')momento(st.fim.quem==='eu'?'fimW':'fimL')">Próxima rodada</button>`;
const revBtn = () => `<button class="btn" onclick="revela();render()">Correr!</button>`;

// ---------- Rodada: Duelo (decidido no ticket #9) ----------
function VariantC(){
  const eu=BARALHO[st.eu[0]], cpu=BARALHO[st.cpu[0]], R=st.fase==='revelado';
  const tot = BARALHO.length, pe = 100*st.eu.length/tot, pt = 100*st.empate.length/tot;
  const tug = `<div class="C-tugl"><span>Você ${st.eu.length}</span><span class="muted">Rodada ${st.rodada}/${LIMITE}${st.empate.length?` · 🤝 ${st.empate.length}`:''}</span><span>${st.cpu.length} Computador</span></div>
    <div class="C-tug"><i style="width:${pe}%;background:#1b8a3a"></i><i style="width:${pt}%;background:#d9b44a"></i><i style="flex:1;background:#c62828"></i></div>`;
  let duel = '';
  if (R && st.duel) {
    const a=ATR[st.atr], ce=st.res===1?'w':st.res===-1?'l':'', cc=st.res===-1?'w':st.res===1?'l':'';
    const lane = (c,who,cls) => `<div class="lane ${st.duelOk?cls:''}" data-cls="${cls}" style="${vars(c)}"><div class="who"><div class="avatar">${ini(c.nome)}</div><div>${c.nome}<div class="muted" style="color:#fff9">${who}</div></div><div class="n" data-v="${c.n[st.atr]}">${c.n[st.atr]}</div></div>
       <div class="track"><i data-w="${c.tipo==='st'?100:c.n[st.atr]}" style="width:${st.duelOk?(c.tipo==='st'?100:c.n[st.atr]):0}%"></i></div></div>`;
    duel = st.peek
      ? `<div class="C-duel"><h2>${a.ico} ${a.etapa}</h2><div class="C-peek">${carta(eu,{hi:st.atr,hiCls:ce})}${carta(cpu,{hi:st.atr,hiCls:cc})}</div>
          <button class="btn sec" onclick="st.peek=false;render()">Voltar</button></div>`
      : `<div class="C-duel ${st.duelOk?'done':''}" onclick="pular(event)"><h2 class="pop">${a.ico} ${a.etapa}</h2><div class="sub">${st.escolhe==='eu'?'Você escolheu':'O computador escolheu'} ${a.nome}</div>
          ${F().botaoPular?'<button class="skip" onclick="event.stopPropagation();momento(\'pulou\');terminaDuelo()">Pular ⏩</button>':''}
          ${lane(eu,'Você',ce)}${lane(cpu,'Computador',cc)}
          <div class="hint">toque na tela para pular</div>
          <div class="C-verdict">${resTxt().replace(/class="res-\w"/,'')}<small>${porque(eu,cpu,st.atr,st.res)} ${levaTxt()}</small></div>
          <div class="acts" style="display:grid;gap:8px">${proxBtn()}<button class="btn sec" onclick="st.peek=true;render()">Ver as duas cartas</button></div></div>`;
  }
  return `<div class="scr"><div class="topbar">${menuBtn()}<span>Nível ${st.nivel==='facil'?'Fácil':'Normal'}</span></div>
    <div class="C-wrap">${tug}<div style="height:10px"></div>
    ${carta(eu,{click:st.fase==='escolher', sel: st.fase==='escolher'?st.sel:st.atr})}
    <div class="stage">${stageTxt()}</div>${st.fase==='cpuEscolheu'?revBtn():''}</div></div>${duel}`;
}

// ---------- Telas comuns ----------
function Inicio(){
  const f=[BARALHO[0],BARALHO[31],BARALHO[19]];
  return `<div class="home"><div class="muted">PROTÓTIPO · som, vibração e tempo</div><h1>Super Trunfo<br>Ciclismo</h1>
    <div class="fan">${f.map((c,i)=>`<div class="card" style="${vars(c)};transform:rotate(${(i-1)*14}deg) translateX(${(i-1)*30}px)"><div class="c-head" style="height:100%"><div class="avatar" style="width:60px;height:60px;font-size:20px;top:40px">${ini(c.nome)}</div></div></div>`).join('')}</div>
    <div><div style="font-weight:800;margin-bottom:6px">Você contra o computador</div>
    <div class="seg"><button class="${st.nivel==='facil'?'on':''}" onclick="st.nivel='facil';render()"><b>Fácil</b><span>Escolhe o atributo no sorteio</span></button>
      <button class="${st.nivel==='normal'?'on':''}" onclick="st.nivel='normal';render()"><b>Normal</b><span>Escolhe o melhor atributo da carta</span></button></div></div>
    <div style="display:flex;justify-content:space-between;align-items:center"><span class="muted">Som e vibração</span>${somBtn()}</div>
    <button class="btn" onclick="ac();novaPartida();render()">Jogar</button>
    <details><summary>Como jogar</summary><p>Cada um recebe 16 cartas. Quem escolhe toca num atributo da carta de cima. A nota mais alta ganha e leva as duas cartas.</p>
      <p>Empate: as cartas ficam no meio e vão para quem ganhar a próxima. O Super Trunfo ganha de todas, menos das Cartas A.</p>
      <p>Ganha quem ficar com todas as cartas, ou quem tiver mais na rodada ${LIMITE}.</p></details></div>`;
}
function Sorteio(){
  const eu = st.primeiro==='eu';
  return `<div class="home center"><div class="muted">Partida nova · Nível ${st.nivel==='facil'?'Fácil':'Normal'}</div>
    <div class="coin pop">${eu?'🙋':'🤖'}</div><div class="big">${eu?'Você começa!':'O computador começa.'}</div>
    <p class="muted">As 32 cartas foram embaralhadas. Cada um tem 16.<br>${eu?'Você escolhe o atributo da 1ª rodada.':'Ele escolhe o atributo da 1ª rodada.'}</p>
    <button class="btn" onclick="st.tela='rodada';iniciaRodada();render()">Ver minha primeira carta</button></div>`;
}
function Fim(){
  const f=st.fim, w=f.quem==='eu', t=f.quem==='empate';
  const tit = t ? 'Empate!' : w ? 'Você ganhou! 🏆' : 'O computador ganhou.';
  const mot = f.motivo==='limite' ? `Chegou a rodada ${LIMITE}. ${t?'Os dois têm o mesmo número de cartas.':'Ganha quem tem mais cartas.'}`
    : f.motivo==='sem-cartas-empate' ? `${w?'O computador':'Você'} ficou sem cartas num empate. ${st.empate.length} cartas no meio não contam.` : `${w?'Você':'O computador'} ficou com todas as cartas.`;
  return `<div class="home"><div class="center"><div class="big ${t?'res-t':w?'res-w':'res-l'}" style="font-size:34px">${tit}</div><p class="muted">${mot}</p></div>
    <div class="score-big"><div>${st.eu.length}<small>Você</small></div><div class="muted">×</div><div>${st.cpu.length}<small>Computador</small></div></div>
    <div class="stats"><div><span class="muted">Rodadas</span><b>${st.rodada}</b></div><div><span class="muted">Nível</span><b>${st.nivel==='facil'?'Fácil':'Normal'}</b></div>
      <div><span class="muted">Rodadas que você ganhou</span><b>${st.ganhas.eu}</b></div><div><span class="muted">Empates</span><b>${st.ganhas.empate}</b></div></div>
    <button class="btn" onclick="novaPartida();render()">Jogar de novo</button><button class="btn sec" onclick="st.tela='inicio';render()">Voltar ao início</button></div>`;
}
const Menu = () => `<div class="sheet" onclick="if(event.target===this){st.menu=false;render()}"><div class="slideup"><b>Sair da partida?</b><span class="muted">A partida não é salva. Você perde o placar.</span>
  <button class="btn" onclick="st.menu=false;render()">Continuar jogando</button><button class="btn sec" onclick="st.tela='inicio';st.menu=false;render()">Sair para o início</button></div></div>`;

// ---------- Render + barra do protótipo ----------
function render(){
  const V = VariantC;
  const T = { inicio:Inicio, sorteio:Sorteio, rodada:V, fim:Fim }[st.tela];
  document.getElementById('frame').className = 'frame' + (st.cel?' cel':'');
  document.getElementById('app').innerHTML = T() + (st.menu?Menu():'');
  if (st.tela==='rodada' && st.duel && !st.peek && st.duelVai) { st.duelVai=false; setTimeout(comecaDuelo, 40); }
  document.getElementById('proto').innerHTML = `
    <div class="log" id="log">${st.log}</div>
    <div class="pill"><button onclick="cyc(-1)">←</button><span class="lbl">${st.variant} (${VARIANTS[st.variant]})</span><button onclick="cyc(1)">→</button></div>
    <div class="pill"><button class="${st.cel?'on':''}" onclick="st.cel=true;render()">📱 celular</button><button class="${!st.cel?'on':''}" onclick="st.cel=false;render()">🖥️ desktop</button>
      ${st.tela==='rodada'?`<button onclick="auto(10)">+10 rodadas</button><button onclick="auto(999)">ir ao fim</button><button onclick="daST()">ST na minha mão</button>`:''}</div>`;
  document.getElementById('state').textContent = st.tela!=='rodada' ? `sensação: ${st.variant} · som: ${st.som?'ligado':'desligado'} · vibra: ${podeVibrar?'sim':'não (simulado)'}\ntela: ${st.tela}` :
    `sensação: ${st.variant} · som: ${st.som?'ligado':'desligado'} · vibra: ${podeVibrar?'sim':'não (simulado)'}\nbarras: ${F().bar}s${F().stagger?' ×2 (uma depois da outra)':''} · último duelo: ${st.tempo??'-'}s\ntela: rodada ${st.rodada} · fase: ${st.fase}\nescolhe: ${st.escolhe} · nível: ${st.nivel}\neu (${st.eu.length}): ${BARALHO[st.eu[0]].nome}\ncpu (${st.cpu.length}): ${BARALHO[st.cpu[0]].nome}\nempate: ${st.empate.length}\natr: ${st.atr!=null?ATR[st.atr].nome:'-'} · res: ${st.res??'-'}`;
  try { history.replaceState(null,'','?'+new URLSearchParams({variant:st.variant, tela:st.cel?'celular':'desktop'})); } catch(e) {}
}
function cyc(d){ const k=Object.keys(VARIANTS); st.variant=k[(k.indexOf(st.variant)+d+k.length)%k.length]; st.som=F().somIni; render(); }
function auto(n){ for (let k=0;k<n && st.tela==='rodada';k++){ if (st.fase!=='revelado'){ if (st.atr==null) st.atr=forca[st.eu[0]].indexOf(Math.max(...forca[st.eu[0]])); revela(); } proxima(); } st.duelVai=false; if (st.tela==='rodada'){ st.sel=null; } render(); }
function daST(){ const i=BARALHO.findIndex(c=>c.tipo==='st'); for (const m of ['eu','cpu','empate']) { const p=st[m].indexOf(i); if (p>=0) st[m].splice(p,1); } st.eu.unshift(i); iniciaRodada(); render(); }
addEventListener('keydown', e => { if (e.target.closest('input,textarea,[contenteditable]')) return; if (e.key==='ArrowLeft') cyc(-1); if (e.key==='ArrowRight') cyc(1); });
render();
</script>
</body>
</html>
