# Estimativa de minutos/mês (franquia da conta: 2.000 min/mês nos repos privados).
# - Gatilho: só pull_request (+ workflow_dispatch manual). Nada de push: seria o
#   mesmo commit testado duas vezes.
# - Eventos/mês: ~60 (cerca de 20 PRs, cada um com ~3 rodadas entre abrir e
#   atualizar), mais umas poucas rodadas manuais.
# - Jobs por evento: 1, só ubuntu-latest (multiplicador 1).
# - Duração: ~3 a 4 min (npm ci com cache, Chromium, typecheck, unidade, baralho,
#   build e Playwright). Cobrança arredonda pra cima por job: 4 min.
# - Total: 60 × 1 × 1 × 4 min ≈ 240 min/mês, uns 12% dos 2.000. Folga grande.
#   (Hoje o repo é público: não gasta franquia. A conta vale se ele virar privado.)
name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Testes de unidade
        run: npm test

      - uses: astral-sh/setup-uv@v6

      - name: Testes do gerador do baralho
        run: uv run --with pytest pytest scripts/tests

      - name: Baralho em dia com os CSV
        run: |
          uv run python scripts/gerar_baralho.py
          git diff --exit-code -- src/dados/baralho.json || {
            echo "::error::src/dados/baralho.json está velho. Rode: uv run python scripts/gerar_baralho.py e faça commit."
            exit 1
          }

      - name: Instalar o Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: Playwright
        run: npm run test:e2e

      - name: Relatório do Playwright (se falhar)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
